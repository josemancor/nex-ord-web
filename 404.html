<!DOCTYPE html>

    <title>404 - Anomalía de Entropía</title>

    <!-- Case-Insensitive / Direct URL Intelligent Router -->
    <script>
        (function() {
            var rawPath = window.location.pathname;
            var path = rawPath.toLowerCase();
            var search = window.location.search || '';
            var hash = window.location.hash || '';
            var isGitHubPages = rawPath.includes('/nex-ord-web/');
            var base = isGitHubPages ? '/nex-ord-web/' : '/';

            if (path.includes('demo')) {
                window.location.replace(base + 'visord_demo.html' + search + hash);
            } else if (path.includes('cultural') || path.includes('liter')) {
                window.location.replace(base + 'visord_cultural.html' + search + hash);
            } else if (path.includes('g2t1c1') || path.includes('visord')) {
                window.location.replace(base + 'visord_g2t1c1.html' + search + hash);
            } else if (path.includes('plataforma') || path.includes('investig')) {
                window.location.replace(base + 'v_plataforma.html' + search + hash);
            } else if (path.includes('participante') || path.includes('retorno')) {
                window.location.replace(base + 'retorno_participante.html' + search + hash);
            }
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
