<!DOCTYPE html>
<html lang="es">
<head>
  <!-- =========================================================================
       NEXORD CANONICAL CLEAN BOOT & ANTI-CACHE RESET
       ========================================================================= -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>
    (function() {
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      try {
        sessionStorage.clear();
      } catch(e) {}
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) regs[i].unregister();
        }).catch(function(){});
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
        }).catch(function(){});
      }
      window.addEventListener('pageshow', function(ev) {
        if (ev.persisted) {
          window.location.reload();
        }
      });
    })();
  </script>

  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=visord_demo.html">
  <title>Redirigiendo a VISORD Demo 3D...</title>
  <link rel="canonical" href="https://nexord.org/visord_demo.html">
  <link rel="stylesheet" href="nexord_dial_nav.css">
</head>
<body>
  <p>Redirigiendo a <a href="visord_demo.html">VISORD Demo 3D</a>...</p>
  <script src="nexord_dial_nav.js" defer></script>
</body>
</html>
