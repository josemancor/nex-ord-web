<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORD · Espectrograma Panorámico 18D (Trazo Diagonal Denso y Bloques Esbeltos)</title>
  <style>
    body {
      margin: 0;
      padding: 25px;
      background-color: #060A16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #F8FAFC;
    }
    .header-info {
      margin-bottom: 18px;
      text-align: center;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 22px;
      font-size: 13px;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid #1E3A8A;
      background: #0B132B;
      color: #00FF87;
      transition: all 0.2s ease;
    }
    button:hover, button.active {
      background: #00FF87;
      color: #060A16;
      border-color: #00FF87;
      box-shadow: 0 0 14px rgba(0, 255, 135, 0.4);
    }
    .container {
      background: #0B132B;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #1E3A8A;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      max-width: 96vw;
      text-align: center;
    }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      display: block;
    }
    .badge {
      display: inline-block;
      margin-top: 14px;
      padding: 6px 18px;
      background: #00FF87;
      color: #0B132B;
      font-weight: 800;
      font-size: 13px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }
    .subtext {
      font-size: 12px;
      color: #94A3B8;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header-info">
    <h2 style="margin:0 0 6px 0; color:#00FF87;">ESPECTROGRAMA PANORÁMICO 18D · ANATOMÍA COMPUESTA</h2>
    <div style="font-size:13.5px; color:#CBD5E1;">Vástagos B y S Juntos (Δx=22) · Trazo Diagonal Denso (Tensión Diádica) · Amplia Separación entre Bloques (Δ=53 pt)</div>
  </div>

  <div class="controls">
    <button id="btn-dark" class="active" onclick="switchTheme('dark')">🌙 Modo Oscuro (Dark Cockpit)</button>
    <button id="btn-cream" onclick="switchTheme('cream')">☀️ Modo Crema (Editorial Zenodo)</button>
  </div>

  <div class="container" id="img-card">
    <img id="main-img" src="Figura_18D_Espectrograma_Panoramico_Dark.png" alt="Espectrograma Panorámico 18D">
    <div>
      <span class="badge" id="badge-info">Nueva Arquitectura: Trazo Diagonal Denso y Bloques Esbeltos</span>
      <div class="subtext" id="file-info">Archivo cargado: <code>Figura_18D_Espectrograma_Panoramico_Dark.png</code></div>
    </div>
  </div>

  <script>
    function switchTheme(theme) {
      const img = document.getElementById('main-img');
      const fileInfo = document.getElementById('file-info');
      const btnDark = document.getElementById('btn-dark');
      const btnCream = document.getElementById('btn-cream');
      const card = document.getElementById('img-card');

      if (theme === 'dark') {
        img.src = 'Figura_18D_Espectrograma_Panoramico_Dark.png';
        fileInfo.innerHTML = 'Archivo cargado: <code>Figura_18D_Espectrograma_Panoramico_Dark.png</code>';
        btnDark.classList.add('active');
        btnCream.classList.remove('active');
        card.style.background = '#0B132B';
        card.style.borderColor = '#1E3A8A';
        document.body.style.backgroundColor = '#060A16';
      } else {
        img.src = 'Figura_18D_Espectrograma_Panoramico_Crema.png';
        fileInfo.innerHTML = 'Archivo cargado: <code>Figura_18D_Espectrograma_Panoramico_Crema.png</code>';
        btnCream.classList.add('active');
        btnDark.classList.remove('active');
        card.style.background = '#FFFFFF';
        card.style.borderColor = '#CBD5E1';
        document.body.style.backgroundColor = '#F1ECE1';
      }
    }
  </script>
</body>
</html>
