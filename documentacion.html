<!DOCTYPE html>
<html lang="es">
<head>
  <!-- =========================================================================
       NEXORD CANONICAL CLEAN BOOT & ANTI-CACHE RESET
       ========================================================================= -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>
    (function() {
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      try {
        sessionStorage.clear();
      } catch(e) {}
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) regs[i].unregister();
        }).catch(function(){});
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
        }).catch(function(){});
      }
      window.addEventListener('pageshow', function(ev) {
        if (ev.persisted) {
          window.location.reload();
        }
      });
    })();
  </script>

    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=index.html">
    <title>NEXORD</title>
    <script>window.location.replace("index.html" + window.location.search + window.location.hash);</script>
<style>
    /* =========================================================================
       MANDO UNIVERSAL MINIMALISTA EN FILA INDIA (SOLO FLECHAS VISIBLES)
       ========================================================================= */
    .universal-nav-pod {
      position: fixed;
      right: 18px;
      bottom: 20px;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      background: rgba(6, 10, 22, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .nav-pod-btn {
      width: 30px;
      height: 30px;
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      color: #38BDF8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      line-height: 1;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s ease, color 0.2s ease, filter 0.2s ease;
      user-select: none;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
    }
    .nav-pod-btn:hover {
      background: transparent;
      border: none;
      box-shadow: none;
      color: #00FF87;
      transform: scale(1.32);
      filter: drop-shadow(0 0 10px rgba(0, 255, 135, 0.9));
    }
    .nav-pod-home:hover {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      color: #FFE600 !important;
      filter: drop-shadow(0 0 10px rgba(255, 230, 0, 0.9)) !important;
    }
        .nav-pod-play {
      color: #00FF87 !important;
      border-color: rgba(0, 255, 135, 0.4) !important;
    }
    .nav-pod-play:hover {
      background: #00FF87 !important;
      border-color: #00FF87 !important;
      color: #030308 !important;
      transform: scale(1.18) !important;
      box-shadow: 0 0 16px rgba(0, 255, 135, 0.95) !important;
    }
    .nav-pod-play.playing {
      color: #00E5FF !important;
      border-color: #00E5FF !important;
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.6) !important;
    }

    .nav-pod-disabled {
      opacity: 0.15;
      pointer-events: none;
      cursor: default;
    }
</style>
  <link rel="stylesheet" href="nexord_dial_nav.css">
</head>
<body style="background:#0b1120; color:#38bdf8; font-family:sans-serif; text-align:center; padding-top:100px;">
    <p>Redirigiendo a <a href="index.html" style="color:#00FF87;">NEXORD</a>...</p>

  <!-- =========================================================================
       MANDO UNIVERSAL NEXORD EN FILA INDIA (NAVEGACIÓN LATERAL PERMANENTE)
       ========================================================================= -->
  <nav class="universal-nav-pod" aria-label="Mando Universal NEXORD">
    <a href="index.html" class="nav-pod-btn nav-pod-home" title="Inicio (Portada Principal)"><span>🏠</span></a>
    <span class="nav-pod-btn nav-pod-prev-lvl nav-pod-disabled" title="No aplicable"><span>◀</span></span>
    <div class="nav-pod-page-group">
      <button class="nav-pod-btn nav-pod-prev-screen" onclick="window.scrollBy({top: -window.innerHeight*0.8, behavior: 'smooth'})" title="Pantalla Anterior (Subir)"><span>▲</span></button>
      <button class="nav-pod-btn nav-pod-next-screen" onclick="window.scrollBy({top: window.innerHeight*0.8, behavior: 'smooth'})" title="Pantalla Siguiente (Bajar)"><span>▼</span></button>
    </div>
    <span class="nav-pod-btn nav-pod-next-lvl nav-pod-disabled" title="No aplicable"><span>▶</span></span>
  </nav>

  <script src="nexord_dial_nav.js" defer></script>
</body>
</html>
