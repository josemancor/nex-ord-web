<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E1934" />
      <stop offset="85%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#03060C" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Circular -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Anillo Orbital Neón NEXORD -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#ringGrad)" stroke-width="2.8" stroke-dasharray="14 3" filter="url(#glow)" />

  <!-- Vértice Cenital (Tesla 3-6-9) -->
  <circle cx="32" cy="8" r="2.5" fill="#FFE600" />

  <!-- Símbolo / Número 9 Dorado en el Núcleo -->
  <text x="32" y="39.5" text-anchor="middle" font-family="'Roboto Mono', 'SF Mono', monospace, sans-serif" font-size="22" font-weight="900" fill="#FFE600" filter="url(#glow)" letter-spacing="-0.5">9</text>
</svg>
