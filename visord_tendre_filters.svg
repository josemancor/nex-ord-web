<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- 1. Textura de Vitela Envejecida y Papiro Verjurado -->
    <filter id="filtro-vitela" x="0%" y="0%" width="100%" height="100%">
      <!-- Ruido fractal que simula el grano heterogéneo de la piel/pergamino -->
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="5" result="ruidoPergamino" />
      <feDiffuseLighting in="ruidoPergamino" lighting-color="#f5ecd7" surfaceScale="1.8" result="luzVitela">
        <feDistantLight azimuth="55" elevation="60" />
      </feDiffuseLighting>
      <feComponentTransfer in="luzVitela" result="tonoVitela">
        <feFuncR type="linear" slope="0.95" intercept="0.05" />
        <feFuncG type="linear" slope="0.90" intercept="0.04" />
        <feFuncB type="linear" slope="0.78" intercept="0.02" />
      </feComponentTransfer>
      <feBlend mode="multiply" in="SourceGraphic" in2="tonoVitela" />
    </filter>

    <!-- 2. Tinta Ferrogalvanizada y Grabado Calcográfico (Aguafuerte) -->
    <filter id="filtro-grabado-tinta" x="-10%" y="-10%" width="120%" height="120%">
      <!-- Ligera micro-erosión del trazo vectorial para evitar la perfección digital -->
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="3" result="mordidoAcido" />
      <feDisplacementMap in="SourceGraphic" in2="mordidoAcido" scale="1.4" xChannelSelector="R" yChannelSelector="G" result="trazoGrabado" />
      <!-- Sangrado sutil de tinta sobre papel secante -->
      <feGaussianBlur in="trazoGrabado" stdDeviation="0.25" result="sangradoTinta" />
      <feMerge>
        <feMergeNode in="sangradoTinta" />
        <feMergeNode in="trazoGrabado" />
      </feMerge>
    </filter>

    <!-- 3. Relieve en Cobre Bruñido y Latón Náutico (Astrolabio / Agujas) -->
    <filter id="filtro-metal-nautico" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="sombraBase" />
      <feSpecularLighting in="sombraBase" surfaceScale="3.2" specularConstant="1.2" specularExponent="18" lighting-color="#ffe6a8" result="brilloEspecular">
        <fePointLight x="-100" y="-100" z="220" />
      </feSpecularLighting>
      <feComposite in="brilloEspecular" in2="SourceAlpha" operator="in" result="reflejoDorado" />
      <feComposite in="SourceGraphic" in2="sombraBase" operator="over" result="piezaConSombra" />
      <feBlend mode="screen" in="reflejoDorado" in2="piezaConSombra" />
    </filter>
  </defs>
</svg>
