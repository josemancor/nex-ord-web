      if ('caches' in window) {

          for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);

  <style>

      }

      .hud-lang-picker {

      /* En pantallas muy estrechas, simplificar aún más la cabecera */

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;

        font-weight: 800;

        text-decoration: none;

      }

      @keyframes pulseTapHint {
        0%, 100% {
          box-shadow: 0 0 16px rgba(0, 255, 135, 0.45);
          border-color: var(--neon-green);
        }
        50% {
          box-shadow: 0 0 30px rgba(0, 255, 135, 0.85);

    /* Teléfonos muy pequeños (<= 460px): marca + Dial + Portal + selector de idioma */

  <script>
    let hasNavigated = false;

    function showLangToast(msg) {
      let toast = document.getElementById('idx-lang-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'idx-lang-toast';
        toast.style.cssText = 'position:fixed; top:96px; left:50%; transform:translateX(-50%); background:rgba(4,7,16,0.95); border:1.5px solid #00FF87; color:#FFFFFF; font-family:"Roboto Mono",monospace; font-size:0.82rem; font-weight:800; padding:8px 18px; border-radius:24px; z-index:999999; box-shadow:0 0 24px rgba(0,255,135,0.45); pointer-events:none; transition:opacity 0.25s ease; opacity:0; text-align:center; white-space:nowrap;';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.style.opacity = '1';
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => {
        toast.style.opacity = '0';
      }, 2000);
    }

    let lastIdxLangTap = 0;
    function onLangSelect(lang, ev) {
      if (ev) {
        if (typeof ev.stopPropagation === 'function') ev.stopPropagation();
        if (typeof ev.stopImmediatePropagation === 'function') ev.stopImmediatePropagation();
      }
      const now = Date.now();
      if (now - lastIdxLangTap < 200) return;
      lastIdxLangTap = now;
      setLanguage(lang);
      showLangToast(lang === 'en' ? '🌐 Language: English (International)' : '🌐 Idioma: Español');
    }

    /* ============================================================
       NAVEGACIÓN AL PORTAL · Transfiere el idioma activo (?lang=xx)
       ============================================================ */
    function goToInstitutional(e) {
      if (hasNavigated) return;
      if (e && typeof e.preventDefault === 'function') e.preventDefault();
      hasNavigated = true;
      const curLang = document.documentElement.lang || localStorage.getItem('nexord_lang') || 'es';
      window.location.href = 'index_promocional.html?lang=' + encodeURIComponent(curLang);
    }

    const INDEX_I18N = {
      es: {
        flag: '🇪🇸',
        code: 'ES',
        title: 'NEXORD | La Física de lo Grupal · Diagnóstico Socio-Termodinámico',
        desc: 'NEXORD | Plataforma Científica de Sociometría Ordinal Computacional y Diagnóstico Socio-Termodinámico. Modelado matemático de redes humanas mediante matrices SMIb y variedades de Grassmann.',
        subtitle: 'Hacia una Física de lo Grupal',
        dial: 'Dial Orbital',
        manifesto: 'Manifiesto',
        manifesto_title: 'Abrir Manifiesto Científico Global en HTML',
        custodia: 'Custodia',
        portal: 'Portal Institucional ➔',
        tap_hint: '👆 Pulsa en cualquier lugar para entrar ➔',
        tap_aria: 'Acceder al Portal Institucional NEXORD',
        click_title: 'Haz clic o pulsa en cualquier lugar para acceder al Portal Institucional',
        brand_title: 'Entrar al Portal Institucional NEXORD',
        dial_title: 'Abrir Dial Orbital Epistemológico (9 Sectores)',
        custodia_title: 'Custodia Institucional para Universidades',
        portal_title: 'Entrar al Portal Institucional NEXORD',
        lang_aria: 'Seleccionar idioma',
        dd_aria: 'Idiomas disponibles',
        future_langs: 'Idiomas para futuras localizaciones...'
      },
      en: {
        flag: '🇬🇧',
        code: 'EN',
        title: 'NEXORD | Towards a Physics of the Group · Socio-Thermodynamic Diagnosis',
        desc: 'NEXORD | Computational Ordinal Sociometry & Socio-Thermodynamic Diagnosis Platform. Mathematical modeling of human networks via SMIb matrices and Grassmann manifolds.',
        subtitle: 'Towards a Physics of the Group',

        brand_title: 'Enter NEXORD Institutional Portal',

        custodia_title: 'Institutional Stewardship for Universities',

        dd_aria: 'Available languages',
        future_langs: 'Languages for future localizations...'
      }
    };

    function setLanguage(lang) {
      if (!INDEX_I18N[lang]) lang = 'es';
      try {
        localStorage.setItem('nexord_lang', lang);
      } catch (e) {}
      document.documentElement.lang = lang;
      const dict = INDEX_I18N[lang];

      document.title = dict.title;
      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.setAttribute('content', dict.desc);

      const flagEl = document.getElementById('lang-flag');
      const codeEl = document.getElementById('lang-code');
      if (flagEl) flagEl.textContent = dict.flag;
      if (codeEl) codeEl.textContent = dict.code;

      const subEl = document.querySelector('.brand-subtitle');
      if (subEl) subEl.textContent = dict.subtitle;

      const dialLink = document.querySelector('a[href="dial_orbital.html"]');
      if (dialLink) {
        dialLink.setAttribute('title', dict.dial_title);
        const dialDesktop = dialLink.querySelector('.btn-text-desktop');
        const dialMobile = dialLink.querySelector('.btn-text-mobile');
        if (dialDesktop) dialDesktop.textContent = dict.dial;
        if (dialMobile) dialMobile.textContent = 'Dial';
      }

      const manLink = document.querySelector('a[href="manifiesto.html"]');
      if (manLink) {
        manLink.setAttribute('title', dict.manifesto_title);
        const manDesktop = manLink.querySelector('.btn-text-desktop');
        const manMobile = manLink.querySelector('.btn-text-mobile');
        if (manDesktop) manDesktop.textContent = dict.manifesto;
        if (manMobile) manMobile.textContent = dict.manifesto;
      }

      const portalBtn = document.querySelector('.btn-portal-main');
      if (portalBtn) {
        portalBtn.setAttribute('title', dict.portal_title);
        const portalDesktop = portalBtn.querySelector('.btn-text-desktop');
        const portalMobile = portalBtn.querySelector('.btn-text-mobile');
        if (portalDesktop) portalDesktop.textContent = dict.portal;
        if (portalMobile) portalMobile.textContent = (lang === 'en') ? 'Enter ➔' : 'Entrar ➔';
      }

      const brandBox = document.querySelector('.brand-box');
      if (brandBox) brandBox.setAttribute('title', dict.brand_title);

      const badgeText = document.getElementById('mobile-badge-text');
      if (badgeText) badgeText.textContent = dict.subtitle;

      const tapEl = document.querySelector('#mobile-tap-hint span');
      if (tapEl) tapEl.textContent = dict.tap_hint;

      const clickZone = document.getElementById('click-anywhere-zone');
      if (clickZone) {
        clickZone.setAttribute('aria-label', dict.tap_aria);
        clickZone.setAttribute('title', dict.click_title);
      }

      const heroBg = document.getElementById('hero-bg-cover');
      if (heroBg) heroBg.setAttribute('title', dict.click_title);

      // Botones directos de idioma
      const btnIdxEs = document.getElementById('btn-idx-lang-es');
      const btnIdxEn = document.getElementById('btn-idx-lang-en');
      if (btnIdxEs) {
        btnIdxEs.style.color = (lang === 'es') ? 'var(--neon-green)' : '#94A3B8';
        btnIdxEs.style.fontWeight = (lang === 'es') ? '800' : '700';
        btnIdxEs.classList.toggle('active', lang === 'es');
      }
      if (btnIdxEn) {
        btnIdxEn.style.color = (lang === 'en') ? 'var(--neon-green)' : '#94A3B8';
        btnIdxEn.style.fontWeight = (lang === 'en') ? '800' : '700';
        btnIdxEn.classList.toggle('active', lang === 'en');
      }

      try {
        window.dispatchEvent(new CustomEvent('nexordLangChanged', { detail: { lang: lang } }));
      } catch (e) {}
    }

    function toggleLangMenu(event) {
      if (event) event.stopPropagation();
      const dd = document.getElementById('lang-dropdown');
      const btn = document.getElementById('lang-btn');
      if (dd) {
        const isOpen = dd.classList.toggle('open');
        if (btn) btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      }
    }

    document.addEventListener('click', function(e) {
      const picker = document.querySelector('.lang-picker');
      if (picker && !picker.contains(e.target)) {
        const dd = document.getElementById('lang-dropdown');
        if (dd) dd.classList.remove('open');
        const btn = document.getElementById('lang-btn');
        if (btn) btn.setAttribute('aria-expanded', 'false');
      }
    });

    function initLang() {
      let lang = 'es';
      try {
        const p = new URLSearchParams(window.location.search);
        const urlLang = p.get('lang');
        if (urlLang && INDEX_I18N[urlLang]) {
          lang = urlLang;
        } else {
          const saved = localStorage.getItem('nexord_lang');
          if (saved && INDEX_I18N[saved]) {
            lang = saved;
          } else {
            const browserLang = (navigator.language || '').toLowerCase().split('-')[0];
            if (browserLang === 'en') lang = 'en';
          }
        }
      } catch (e) {}
      setLanguage(lang);
    }
    initLang();

    // Redirección si se invoca con ?dial=open o #dial
    try {
      const p = new URLSearchParams(window.location.search);
      if (p.get('dial') === 'open' || p.get('dial') === 'true' || window.location.hash === '#dial') {
        window.location.replace('dial_orbital.html' + window.location.search + window.location.hash);
      }
    } catch(e) {}

    // Navegación por Teclado: Enter / Espacio -> Portal Institucional | 'D' -> Dial Orbital
    document.addEventListener("keydown", (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') {
        e.preventDefault();
        goToInstitutional();
      } else if (e.key === 'd' || e.key === 'D') {
        e.preventDefault();
        window.location.href = 'dial_orbital.html';
      }
    });
  </script>
