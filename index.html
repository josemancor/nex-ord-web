<style>
:root {
  --bg-dark: #070b14;

* {

}

html, body {

  height: 100%;

  background-image: image-set(
    url('assets/nexord_portada_pasiva.avif') type('image/avif'),
    url('assets/nexord_portada_pasiva.webp') type('image/webp'),
    url('assets/nexord_portada_pasiva.jpg') type('image/jpeg')

  filter: brightness(0.96) contrast(1.06);
  z-index: 1;
  cursor: pointer;
}

/* =========================================================================
   CABECERA INSTITUCIONAL SUPERIOR FLOTANTE
   ========================================================================= */
header {

  top: 0;
  left: 0;

  display: flex;
  justify-content: space-between;
  align-items: center;

  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(56, 189, 248, 0.22);
}

.brand-box {

  align-items: center;
  gap: 14px;

  text-decoration: none;

}

.brand-box:hover {
  transform: translateY(-1px);
}

.brand-logo-img {
  width: 52px;
  height: 52px;
  border-radius: 8px;
  box-shadow: 0 0 18px rgba(0, 255, 135, 0.45);
  transition: all 0.25s ease;
  flex-shrink: 0;
}

.brand-box:hover .brand-logo-img {
  box-shadow: 0 0 25px rgba(0, 255, 135, 0.7);
  transform: scale(1.05);
}

.brand-title {
  font-family: 'Roboto Mono', monospace;
  font-size: 1.65rem;
  font-weight: 900;
  letter-spacing: 1.5px;
  color: #FFFFFF;
  line-height: 1;
}

  color: var(--neon-green);
}

.brand-subtitle {
  font-size: 0.85rem;
  color: #94A3B8;

  letter-spacing: 0.4px;
}

.header-actions {
  display: flex;

  gap: 12px;
}

.btn-nav-header {
  background: rgba(15, 23, 42, 0.85);
  border: 1px solid rgba(56, 189, 248, 0.35);
  color: #F1F5F9;
  padding: 8px 16px;
  font-family: 'Roboto Mono', monospace;
  font-size: 0.85rem;
  font-weight: 700;
  border-radius: 8px;
  text-decoration: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.22s ease;
}

.btn-nav-header:hover {
  background: rgba(56, 189, 248, 0.22);
  border-color: #38BDF8;
  color: #FFF;
  transform: translateY(-1px);
  box-shadow: 0 0 14px rgba(56, 189, 248, 0.45);
}

.btn-portal-main {
  background: rgba(0, 255, 135, 0.18) !important;
  border-color: var(--neon-green) !important;
  color: var(--neon-green) !important;
  font-weight: 800 !important;
  box-shadow: 0 0 16px rgba(0, 255, 135, 0.35) !important;
}

.btn-portal-main:hover {
  background: var(--neon-green) !important;
  color: #070B18 !important;
  box-shadow: 0 0 24px rgba(0, 255, 135, 0.7) !important;
}

/* Selector Internacional de Idioma (ES / EN) */
.lang-picker {
  position: relative;
  display: inline-block;
}

.lang-picker-btn {
  background: rgba(15, 23, 42, 0.9);
  border: 1px solid rgba(56, 189, 248, 0.4);
  color: #FFF;
  padding: 7px 12px;
  font-family: 'Roboto Mono', monospace;
  font-size: 0.82rem;
  font-weight: 700;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}

.lang-picker-btn:hover {
  border-color: var(--neon-green);
  box-shadow: 0 0 12px rgba(0, 255, 135, 0.4);
}

.lang-dropdown {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  background: rgba(7, 11, 20, 0.96);
  border: 1px solid rgba(56, 189, 248, 0.35);
  border-radius: 10px;
  padding: 6px 0;
  min-width: 140px;
  z-index: 100;
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
}

.lang-dropdown.open {
  display: block;
}

.lang-opt {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 7px 14px;
  background: transparent;
  border: none;
  color: #94A3B8;
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  text-decoration: none;
  transition: all 0.15s;
}

.lang-opt:hover, .lang-opt.active {
  background: rgba(56, 189, 248, 0.15);
  color: var(--neon-green);
}

   ZONA DE CLIC UNIVERSAL EN TODA LA PANTALLA
   ========================================================================= */

  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 10;
  cursor: pointer;

<body>

  <!-- FONDO CON LA IMAGEN ARTÍSTICA OFICIAL TOTALMENTE DESPEJADA -->
  <div class="hero-bg-cover" id="hero-bg-cover" onclick="goToInstitutional()" title="Haz clic en cualquier lugar para acceder al Portal Institucional"></div>

  <!-- ZONA DE CLIC UNIVERSAL (100% LIMPIA, SIN RECUADROS NI TEXTOS ENCIMA) -->
  <div class="click-anywhere-zone" onclick="goToInstitutional()" title="Haz clic en cualquier lugar para acceder al Portal Institucional"></div>

  <!-- CABECERA INSTITUCIONAL HUD -->
  <header>
    <a href="index_promocional.html" class="brand-box" title="Entrar al Portal Institucional NEXORD" onclick="event.stopPropagation()">
      <img src="LOGO_NEXORD_OFICIAL.png" alt="Logo NEXORD" class="brand-logo-img" decoding="async" onerror="this.src='assets/logo_nexord_base.png'">
      <div style="display: flex; align-items: baseline; gap: 12px;">
        <span class="brand-title">NEX<span>ORD</span></span>
        <span class="brand-subtitle">Hacia una Física de lo Grupal</span>
      </div>
    </a>

    <div class="header-actions" onclick="event.stopPropagation()">
      <a href="dial_orbital.html" class="btn-nav-header" style="color: #00F0FF; border-color: rgba(0, 240, 255, 0.45);" title="Abrir Dial Orbital Epistemológico (9 Sectores)">
        <span>🧭</span> <span>Dial Orbital</span>
      </a>
      <a href="index_promocional.html#custodia" class="btn-nav-header" style="color: #38BDF8;" title="Custodia Institucional para Universidades">
        <span>🏛️</span> <span>Custodia</span>
      </a>
      <a href="index_promocional.html" class="btn-nav-header btn-portal-main" title="Entrar al Portal Institucional NEXORD">
        <span>🏛️</span> <span>Portal Institucional ➔</span>
      </a>

      <!-- Selector Internacional de Idioma (ES / EN) -->
      <div class="lang-picker">
        <button class="lang-picker-btn" id="lang-btn" type="button" onclick="toggleLangMenu(event)" aria-haspopup="true" aria-expanded="false" aria-label="Seleccionar idioma">
          <span id="lang-flag">🇪🇸</span> <span id="lang-code">ES</span> ▾
        </button>
        <div class="lang-dropdown" id="lang-dropdown" role="menu" aria-label="Idiomas disponibles">
          <button type="button" class="lang-opt active" role="menuitem" onclick="setLanguage('es')">🇪🇸 Español (ES)</button>
          <a href="glosario.html?lang=en" class="lang-opt" role="menuitem">🇬🇧 English (EN)</a>
          <div style="border-top:1px solid rgba(255,255,255,0.12); margin:6px 0 2px 0; padding:6px 8px; font-size:0.68rem; color:#94A3B8; font-style:italic; line-height:1.35;">Idiomas para futuras localizaciones...</div>
        </div>
      </div>
    </div>
  </header>

  <script>
    function goToInstitutional() {
      window.location.href = 'index_promocional.html';
    }

    function toggleLangMenu(e) {
      if (e) e.stopPropagation();
      const dd = document.getElementById("lang-dropdown");
      const btn = document.getElementById("lang-btn");
      if (!dd) return;
      const isOpen = dd.classList.toggle("open");
      if (btn) btn.setAttribute("aria-expanded", isOpen ? "true" : "false");
    }

    window.addEventListener("click", (e) => {
      const dd = document.getElementById("lang-dropdown");
      if (dd && dd.classList.contains("open")) {
        dd.classList.remove("open");
        const btn = document.getElementById("lang-btn");
        if (btn) btn.setAttribute("aria-expanded", "false");
      }
    });

    function setLanguage(lang) {
      localStorage.setItem('nexord_lang', lang);
      const dd = document.getElementById("lang-dropdown");
      if (dd) dd.classList.remove("open");
    }

    // Redirección si se invoca con ?dial=open o #dial
    try {
      const p = new URLSearchParams(window.location.search);
      if (p.get('dial') === 'open' || p.get('dial') === 'true' || window.location.hash === '#dial') {
        window.location.replace('dial_orbital.html' + window.location.search + window.location.hash);
      }
    } catch(e) {}

    // Navegación por Teclado: Enter / Espacio -> Portal Institucional | 'D' -> Dial Orbital
    document.addEventListener("keydown", (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') {
        e.preventDefault();
        goToInstitutional();
      } else if (e.key === 'd' || e.key === 'D') {
        e.preventDefault();
        window.location.href = 'dial_orbital.html';
      }
    });
  </script>

</body>
