<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test EUH • Ejes Unitarios Horizontales</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="js/cultural_synthesis_engine.js"></script>
    <style>
        body {
            background: #080D1A;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 24px;
        }
        .container {
            max-width: 1500px;
            margin: 0 auto;
            background: #0B132B;
            border: 1px solid rgba(0, 245, 212, 0.3);
            border-radius: 12px;
            padding: 20px;
        }
        h1 {
            color: #00F5D4;
            font-size: 1.2rem;
            margin-bottom: 8px;
        }
        p {
            color: #94A3B8;
            font-size: 0.82rem;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📏 Test de Render: Ejes Unitarios Horizontales (EUH) & Packing Verticalizado</h1>
        <p>Estudio: Grupo Terapéutico de Clara (9 Sujetos, Factores F1, F2, F3, Métricas Bilaterales COR/CTA/CTR y Anti-Colisión Multi-Nivel)</p>
        <canvas id="canvas-ejes-unitarios-horiz" style="width: 100%; display: block;"></canvas>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.CulturalSynthesisEngine) {
                window.CulturalSynthesisEngine.setWork('clara');
                window.CulturalSynthesisEngine.setMultidimTab('ejes_horiz');
                const urlParams = new URLSearchParams(window.location.search);
                const g = urlParams.get('geom');
                if (g) {
                    window.CulturalSynthesisEngine.setEUHGeom(g);
                }
            }
        });
    </script>
</body>
</html>
